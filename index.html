<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12061a">
<title>Happy Birthday Kaviya</title>
<meta name="description" content="A little birthday surprise: blow the candles, make a wish and cut the cake.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="gl" aria-label="A birthday cake on a table with family around it"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>

<button id="mute" class="icon-btn" aria-label="Turn sound off" title="Sound">
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path id="muteIcon" fill="currentColor" d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
</button>

<!-- ───── intro ───── -->
<section id="intro" class="screen" aria-labelledby="introName">
  <div class="intro-inner">
    <p class="kicker">a little surprise for</p>
    <h1 id="introName" class="script-name">Kaviya</h1>
    <p class="intro-sub">Today is all about you, girl.</p>
    <button id="openBtn" class="btn primary big">Open your surprise <span aria-hidden="true">🎁</span></button>
    <p class="tiny">Best with sound on 🔊</p>
  </div>
</section>

<!-- ───── headline ───── -->
<header id="headline" class="hidden" aria-hidden="true">
  <p>Happy Birthday</p>
  <h2 class="script-name">Kaviya</h2>
</header>

<div id="lyrics" aria-live="polite"></div>

<!-- ───── bottom prompt ───── -->
<div id="prompt" class="hidden" role="status">
  <p id="promptText"></p>
  <div class="row" id="promptBtns"></div>
</div>

<!-- ───── make-a-wish popup ───── -->
<div id="wish" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="wishTitle">
  <div class="card wishcard">
    <div class="orb" aria-hidden="true"></div>
    <p class="kicker">close your eyes</p>
    <h3 id="wishTitle" class="script-title">Make a wish</h3>
    <p class="muted">Think of the one thing your heart wants most this year. You can whisper it here — it never leaves this page.</p>
    <textarea id="wishInput" maxlength="90" rows="2" placeholder="My wish is…" aria-label="Your wish"></textarea>
    <button id="wishDone" class="btn primary">I made my wish ✨</button>
  </div>
</div>
<div id="wishFloat" class="hidden" aria-hidden="true"><span></span></div>

<!-- ───── cut hint ───── -->
<div id="cutHint" class="hidden" aria-hidden="true">
  <div class="track"><div class="dot"></div></div>
  <p>drag down to cut</p>
</div>

<!-- ───── celebration ───── -->
<div id="bigGreeting" class="hidden" aria-hidden="true">
  <p>Happy Birthday</p>
  <h2 class="script-name">Kaviya</h2>
</div>
<div id="endBar" class="hidden">
  <button id="readNote" class="btn primary">Read my note 💌</button>
  <button id="replay" class="btn ghost">Replay 🔁</button>
</div>

<div id="letter" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="letterTitle">
  <article class="card paper">
    <h3 id="letterTitle" class="script-title"></h3>
    <div id="letterBody"></div>
    <p id="letterClose" class="closing"></p>
    <p id="letterSign" class="sign"></p>
    <button id="letterBack" class="btn primary">Back to the party 🎈</button>
  </article>
</div>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:20px sans-serif">Please enable JavaScript to open Kaviya's birthday surprise 🎂</p></noscript>
<script src="dist/birthday.js"></script>
</body>
</html>
